worker_processes 1;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;

    # Correct upstream name
    upstream frontend_gateway {
        server frontend-gateway.frontend-gateway.svc.cluster.local:8081;
    }

    server {
        listen 80;

        # Serve the SPA
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # API → Gateway
        location /api/ {
            # FIXED: use the correct upstream name
            proxy_pass http://frontend_gateway;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cookie fix
            proxy_set_header Cookie $http_cookie;

            proxy_redirect off;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
        }
    }
}
