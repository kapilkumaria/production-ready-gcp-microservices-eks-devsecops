server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Runtime API endpoint replacement
  location /env.js {
    add_header Content-Type application/javascript;
    return 200 "window.REACT_APP_API_URL='$REACT_APP_API_URL';";
  }
}
