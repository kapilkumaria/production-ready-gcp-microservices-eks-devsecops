worker_processes 1;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;

    upstream gateway {
        server frontend-gateway:8081;
    }

    server {
        listen 80;

        # Serve the SPA
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # API → Gateway
        location /api/ {
            proxy_pass http://gateway;

            # Required for cookies, always
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 🔥 most important (you already added)
            proxy_set_header Cookie $http_cookie;

            # 🔥 browsers sometimes require this for cookie propagation
            proxy_redirect off;

            # Recommended to ensure cookie headers flow correctly
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for consistency
            proxy_buffering off;
        }
    }
}
