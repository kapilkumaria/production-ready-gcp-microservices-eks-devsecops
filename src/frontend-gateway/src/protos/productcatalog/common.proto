syntax = "proto3";

package hipstershop;

// Java options
option java_multiple_files = true;
option java_package = "hipstershop";

// Go output package — MUST MATCH go.mod
option go_package = "production-ready-gcp-microservices-eks-devsecops/src/productcatalogservice/hipstershop";

// Shared empty object
message Empty {}

// Generic address
message Address {
  string street_address = 1;
  string city = 2;
  string state = 3;
  string country = 4;
  string zip_code = 5;
}

// Credit card info
message CreditCardInfo {
  string credit_card_number = 1;
  int32 credit_card_expiration_month = 2;
  int32 credit_card_expiration_year = 3;
  int32 credit_card_cvv = 4;
}

// Monetary value
message Money {
  string currency_code = 1;
  int64 units = 2;
  int32 nanos = 3;
}
