syntax = "proto3";

package hipstershop;

option go_package = "github.com/production/gcp-microservices/frontend/genproto;genproto";

// Recommendation service definition.
service RecommendationService {
  rpc ListRecommendations(ListRecommendationsRequest) returns (ListRecommendationsResponse) {}
}

// The request message containing the user id and product ids in user's cart.
message ListRecommendationsRequest {
  string user_id = 1;
  repeated string product_ids = 2;
}

// The response message containing a list of recommended products.
message ListRecommendationsResponse {
  repeated string product_ids = 1;
}
