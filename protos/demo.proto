syntax = "proto3";

package hipstershop;

option go_package = "github.com/production/gcp-microservices/frontend/genproto;genproto";

// ===================================================================
// Empty message
// ===================================================================
message Empty {}

// ===================================================================
// Product (used throughout the store)
// ===================================================================
message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  string picture = 4;
  Price priceUsd = 5;

  // Categories for filtering
  repeated string categories = 6;
}

// ===================================================================
// Money / Currency
// ===================================================================
message Money {
  // The 3-letter currency code defined in ISO 4217.
  string currency_code = 1;

  // Whole units of currency.
  int64 units = 2;

  // Nano units (10^-9) of currency.
  int32 nanos = 3;
}

message Price {
  Money amount = 1;
}

// ===================================================================
// Add to cart requests
// ===================================================================
message AddToCartRequest {
  string user_id = 1;
  string product_id = 2;
  int32 quantity = 3;
}

// ===================================================================
// Shopping cart
// ===================================================================
message CartItem {
  Product product = 1;
  int32 quantity = 2;
}

message Cart {
  repeated CartItem items = 1;
}

// ===================================================================
// Recommendations
// ===================================================================
message ListRecommendationsRequest {
  string product_id = 1;
}

message ListRecommendationsResponse {
  repeated string product_ids = 1;
}

// ===================================================================
// Shipping address
// ===================================================================
message Address {
  string street_address = 1;
  string city = 2;
  string state = 3;
  string country = 4;
  string zip_code = 5;
}

// ===================================================================
// Order request & response
// ===================================================================
message PlaceOrderRequest {
  string user_id = 1;
  Address shipping_address = 2;
  repeated CartItem items = 3;
}

message PlaceOrderResponse {
  string order_id = 1;
}

// ===================================================================
// Health Check
// ===================================================================
message HealthCheckRequest {}
message HealthCheckResponse {
  string status = 1;
}
