syntax = "proto3";

package hipstershop;

option java_multiple_files = true;
option java_package = "hipstershop";
option go_package = "frontend/genproto";

import "productcatalog/common.proto";  // to use Empty

message HelloRequest {
  string name = 1;
}

message HelloResponse {
  string message = 1;
}

service DemoService {
  rpc SayHello(HelloRequest) returns (HelloResponse) {}
}
