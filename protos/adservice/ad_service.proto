syntax = "proto3";

package hipstershop;

option java_multiple_files = true;
option java_package = "hipstershop";
option go_package = "frontend/genproto";

message AdRequest {
  repeated string context_keys = 1;
}

message Ad {
  string redirect_url = 1;
  string text = 2;
}

message AdResponse {
  repeated Ad ads = 1;
}

service AdService {
  rpc GetAds(AdRequest) returns (AdResponse) {}
}
