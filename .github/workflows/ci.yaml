name: Build-Scan-CI

# on:
#   push:
#     branches: ["main"]
#   workflow_dispatch:

jobs:

  ############################################################
  # 1. BUILD + SCAN + PUSH (MATRIX)
  ############################################################
  build-scan:
    runs-on: self-hosted

    strategy:
      matrix:
        service:
          - checkoutservice
          - adservice
          - currencyservice
          - paymentservice
          - productcatalogservice
          - frontend-ui
          - frontend-gateway
          - cartservice
          - emailservice
          - shoppingassistantservice
          - shippingservice
          - recommendationservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      ############################################################
      # DETERMINE DOCKERFILE PATH
      ############################################################
      - name: Determine Dockerfile Path
        id: pathcheck
        run: |
          SERVICE="${{ matrix.service }}"

          DOCKERFILE="src/$SERVICE/Dockerfile"
          CONTEXT="src/$SERVICE"

          if [ "$SERVICE" = "cartservice" ]; then
            DOCKERFILE="src/cartservice/src/Dockerfile"
            CONTEXT="src/cartservice/src"
          fi

          if [ "$SERVICE" = "frontend-gateway" ]; then
            DOCKERFILE="src/frontend-gateway/Dockerfile"
            CONTEXT="."
          fi

          if [ -f "$DOCKERFILE" ]; then
            echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "context=$CONTEXT" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      ############################################################
      # DOCKER BUILD
      ############################################################
      - name: Build Docker Image
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          docker build \
            -t ${{ matrix.service }}:latest \
            -f ${{ steps.pathcheck.outputs.dockerfile }} \
            ${{ steps.pathcheck.outputs.context }}

      ############################################################
      # LOGIN TO ECR
      ############################################################
      - name: AWS ECR Login
        if: steps.pathcheck.outputs.found == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region us-east-1 |
            docker login --username AWS \
              --password-stdin 931058976119.dkr.ecr.us-east-1.amazonaws.com

      ############################################################
      # TAG & PUSH TO ECR
      ############################################################
      - name: Push Image to ECR
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          ECR="931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices"

          IMAGE="$ECR/${{ matrix.service }}:$TAG"

          docker tag ${{ matrix.service }}:latest $IMAGE
          docker push $IMAGE

          echo "$IMAGE" > image.txt

      ############################################################
      # UPLOAD IMAGE TAG AS ARTIFACT
      ############################################################
      - name: Upload Image Artifact
        if: steps.pathcheck.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: image.txt



  ############################################################
  # 2. UPDATE KUSTOMIZATION.YAML (ONE JOB ONLY)
  ############################################################
  update-manifests:
    runs-on: self-hosted
    needs: build-scan

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      ############################################################
      # DOWNLOAD BUILT IMAGE ARTIFACTS
      ############################################################
      - name: Download all image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
          merge-multiple: false

      ############################################################
      # UPDATE KUSTOMIZATION.YAML USING YQ (CORRECT WAY)
      ############################################################
      - name: Update tags in kustomization.yaml
        run: |
          FILE="k8s-manifests/overlays/dev/kustomization.yaml"

          for f in images/*/image.txt; do
            IMG=$(cat "$f")
            NAME=$(echo "$IMG" | awk -F'[:/]' '{print $(NF-1)}')
            TAG=$(echo "$IMG" | awk -F: '{print $2}')
            REPO=$(echo "$IMG" | awk -F: '{print $1}')

            echo "Updating: $NAME → $REPO:$TAG"

            yq -i "
              (.images[] | select(.name == \"$NAME\").newName) = \"$REPO\" |
              (.images[] | select(.name == \"$NAME\").newTag) = \"$TAG\"
            " "$FILE"
          done

      ############################################################
      # COMMIT CHANGES SAFELY
      ############################################################
      - name: Commit manifest update
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git add k8s-manifests/overlays/dev/kustomization.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update image tags for all services"
            git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git
            echo "Pushed ✔"
          else
            echo "No changes to commit."
          fi



  ############################################################
  # 3. DONE (ARGOCD AUTO-SYNC)
  ############################################################
  done:
    needs: update-manifests
    runs-on: self-hosted
    steps:
      - run: echo "CI/CD completed — ArgoCD will now sync latest images!"
