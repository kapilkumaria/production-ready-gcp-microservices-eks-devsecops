name: Build-Scan-CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-scan:
    runs-on: self-hosted

    strategy:
      matrix:
        service:
          - checkoutservice
          - adservice
          - currencyservice
          - paymentservice
          - productcatalogservice
          - frontend-ui
          - frontend-gateway
          - cartservice
          - emailservice
          - shoppingassistantservice
          - shippingservice
          - recommendationservice

    steps:
      ############################################################
      # 1. CHECKOUT
      ############################################################
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ############################################################
      # 2. SONAR SCANNER
      ############################################################
      - name: Add Sonar Scanner to PATH
        run: echo "/opt/devsecops-tools/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Verify Sonar Scanner
        run: sonar-scanner --version

      ############################################################
      # 3. SONAR SCAN
      ############################################################
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd src/${{ matrix.service }}

          sonar-scanner \
            -Dsonar.projectKey=${{ matrix.service }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.sources=. \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.qualitygate.wait=false \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/build/**,**/obj/**,**/bin/**,**/.gradle/**,**/*.md,LICENSE"

      ############################################################
      # 4. DETERMINE DOCKERFILE PATH
      ############################################################
      - name: Determine Dockerfile Path
        id: pathcheck
        run: |
          SERVICE="${{ matrix.service }}"

          # Default paths
          DOCKERFILE="src/$SERVICE/Dockerfile"
          CONTEXT="src/$SERVICE"

          # Special case: cartservice (.NET)
          if [ "$SERVICE" = "cartservice" ]; then
            DOCKERFILE="src/cartservice/src/Dockerfile"
            CONTEXT="src/cartservice/src"
          fi

          # Skip frontend-gateway (no Dockerfile)
          if [ "$SERVICE" = "frontend-gateway" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -f "$DOCKERFILE" ]; then
            echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "context=$CONTEXT" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      ############################################################
      # 5. DOCKER BUILD
      ############################################################
      - name: Build Docker Image
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          SERVICE="${{ matrix.service }}"
          DOCKERFILE="${{ steps.pathcheck.outputs.dockerfile }}"
          CONTEXT="${{ steps.pathcheck.outputs.context }}"
          IMAGE="${SERVICE}:latest"

          echo "🔥 Building image: $IMAGE"
          echo "📄 Dockerfile: $DOCKERFILE"
          echo "📂 Context: $CONTEXT"

          docker build -t $IMAGE -f $DOCKERFILE $CONTEXT

      ############################################################
      # 6. TRIVY SCAN + PROFESSIONAL SUMMARY
      ############################################################
      - name: Trivy Scan (Professional Output)
        if: steps.pathcheck.outputs.found == 'true'
        id: trivy
        run: |
          SERVICE="${{ matrix.service }}"
          IMAGE="${SERVICE}:latest"

          mkdir -p trivy-reports

          # Full table report
          trivy image \
            --format table \
            -o trivy-reports/${SERVICE}.txt \
            $IMAGE || true

          # JSON report for severity parsing
          trivy image \
            --format json \
            -o trivy-reports/${SERVICE}.json \
            $IMAGE || true

          # Extract severity counts
          CRIT=$(jq '.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL") | .Severity' trivy-reports/${SERVICE}.json | wc -l)
          HIGH=$(jq '.Results[].Vulnerabilities[]? | select(.Severity=="HIGH") | .Severity' trivy-reports/${SERVICE}.json | wc -l)
          MED=$(jq '.Results[].Vulnerabilities[]? | select(.Severity=="MEDIUM") | .Severity' trivy-reports/${SERVICE}.json | wc -l)
          LOW=$(jq '.Results[].Vulnerabilities[]? | select(.Severity=="LOW") | .Severity' trivy-reports/${SERVICE}.json | wc -l)

          # Write professional summary
          {
            echo "## 🛡 Trivy Security Scan — $SERVICE"
            echo "**Image:** \`$IMAGE\`"
            echo ""
            echo "### 🔢 Vulnerability Summary"
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| 🔥 CRITICAL | $CRIT |"
            echo "| ❤️ HIGH | $HIGH |"
            echo "| 💛 MEDIUM | $MED |"
            echo "| 💙 LOW | $LOW |"
            echo ""
            echo "<details><summary><strong>🔍 Full Report (Click to Expand)</strong></summary>"
            echo ""
            echo "\`\`\`"
            cat trivy-reports/${SERVICE}.txt
            echo "\`\`\`"
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

      ############################################################
      # 7. UPLOAD TRIVY REPORT ARTIFACT
      ############################################################
      - name: Upload Trivy Report
        if: steps.pathcheck.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-reports/

      ############################################################
      # 8. DOCKER CLEANUP
      ############################################################
      - name: Cleanup Docker Image
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          docker rmi "${{ matrix.service }}:latest" || true
