name: Microservices-CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sonar:
    name: Sonar + Tests + Coverage
    runs-on: self-hosted

    strategy:
      matrix:
        include:
          - service: checkoutservice
            language: go

          - service: adservice
            language: java

          - service: currencyservice
            language: node

          - service: paymentservice
            language: node

          - service: productcatalogservice
            language: go

          - service: frontend-ui
            language: node

          - service: frontend-gateway
            language: node

          - service: cartservice
            language: csharp

          - service: emailservice
            language: python

          - service: shoppingassistantservice
            language: python

          - service: shippingservice
            language: go

          - service: recommendationservice
            language: python

    steps:
      ###########################################################
      #                     CHECK OUT CODE
      ###########################################################
      - name: Checkout Code
        uses: actions/checkout@v4

      ###########################################################
      #                 PREPARE SONAR SCANNER
      ###########################################################
      - name: Add sonar-scanner to PATH
        run: echo "/opt/sonar-scanner/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Verify sonar-scanner
        run: |
          which sonar-scanner
          sonar-scanner --version

      ###########################################################
      #             LANGUAGE-SPECIFIC PREPARATION
      ###########################################################

      # JAVA (adservice)
      - name: Verify Java installation
        if: matrix.language == 'java'
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # NODE.js (currencyservice, gateway, ui, paymentservice)
      - name: Setup Node.js tools
        if: matrix.language == 'node'
        run: |
          cd src/${{ matrix.service }}
          npm install

      # PYTHON
      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          cd src/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # C#
      - name: Install .NET SDK (if not present)
        if: matrix.language == 'csharp'
        run: |
          sudo apt-get update
          sudo apt-get install -y dotnet-sdk-8.0

      ###########################################################
      #              LANGUAGE-SPECIFIC TEST + COVERAGE
      ###########################################################

      # -------- JAVA (JaCoCo) ------------
      - name: Run Java Tests
        if: matrix.language == 'java'
        run: |
          cd src/${{ matrix.service }}
          ./gradlew clean test jacocoTestReport

      # -------- NODE.js ------------------
      - name: Run Node.js Tests
        if: matrix.language == 'node'
        run: |
          cd src/${{ matrix.service }}
          npm test -- --coverage

      # -------- PYTHON -------------------
      - name: Run Python Tests
        if: matrix.language == 'python'
        run: |
          cd src/${{ matrix.service }}
          pytest --cov=. --cov-report=xml

      # -------- GO -----------------------
      - name: Run Go Tests with Coverage
        if: matrix.language == 'go'
        run: |
          cd src/${{ matrix.service }}
          go test ./... -coverprofile=coverage.out

      # -------- C# -----------------------
      - name: Run C# Tests with Coverage
        if: matrix.language == 'csharp'
        run: |
          cd src/${{ matrix.service }}
          dotnet test \
            /p:CollectCoverage=true \
            /p:CoverletOutput=./coverage.opencover.xml \
            /p:CoverletOutputFormat=opencover

      ###########################################################
      #                  SONARQUBE SCAN + QG
      ###########################################################

      - name: Run SonarQube Scan (with Quality Gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd src/${{ matrix.service }}

          sonar-scanner \
            -Dsonar.projectKey=${{ matrix.service }} \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true \
            $( [ "${{ matrix.language }}" = "java" ] && echo "-Dsonar.java.binaries=build/classes/java/main" )
