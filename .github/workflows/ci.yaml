name: Build-Scan-CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:

  ############################################################
  # 1. BUILD + SCAN + PUSH (MATRIX)
  ############################################################
  build-scan:
    runs-on: self-hosted

    strategy:
      matrix:
        service:
          - checkoutservice
          - adservice
          - currencyservice
          - paymentservice
          - productcatalogservice
          - frontend-ui
          - frontend-gateway
          - cartservice
          - emailservice
          - shoppingassistantservice
          - shippingservice
          - recommendationservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Dockerfile Path
        id: pathcheck
        run: |
          SERVICE="${{ matrix.service }}"

          DOCKERFILE="src/$SERVICE/Dockerfile"
          CONTEXT="src/$SERVICE"

          if [ "$SERVICE" = "cartservice" ]; then
            DOCKERFILE="src/cartservice/src/Dockerfile"
            CONTEXT="src/cartservice/src"
          fi

          if [ "$SERVICE" = "frontend-gateway" ]; then
            DOCKERFILE="src/frontend-gateway/Dockerfile"
            CONTEXT="."
          fi

          if [ -f "$DOCKERFILE" ]; then
            echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "context=$CONTEXT" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker Image
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          docker build \
            -t ${{ matrix.service }}:latest \
            -f ${{ steps.pathcheck.outputs.dockerfile }} \
            ${{ steps.pathcheck.outputs.context }}

      - name: AWS ECR Login
        if: steps.pathcheck.outputs.found == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region us-east-1 |
            docker login --username AWS \
              --password-stdin 931058976119.dkr.ecr.us-east-1.amazonaws.com

      - name: Push Image to ECR
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          ECR="931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices"
          FULL="$ECR/${{ matrix.service }}:$TAG"

          docker tag ${{ matrix.service }}:latest $FULL
          docker push $FULL

          echo "$FULL" > image.txt

      - name: Upload Image Artifact
        if: steps.pathcheck.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: image.txt

  ############################################################
  # 2. UPDATE KUSTOMIZATION.YAML SAFELY
  ############################################################
  update-manifests:
    runs-on: self-hosted
    needs: build-scan

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
          merge-multiple: false

      ############################################################
      # REPLACE ALL PLACEHOLDER TAGS WITH REAL TAGS
      ############################################################
      
      - name: Update tags in kustomization.yaml
        run: |
          FILE="k8s-manifests/overlays/dev/kustomization.yaml"

          for f in images/*/image.txt; do
            IMG=$(cat "$f")  # example: 9310.../adservice:abc1234
            REPO=$(echo "$IMG" | awk -F: '{print $1}')
            TAG=$(echo "$IMG" | awk -F: '{print $2}')

            echo "Updating: $REPO → tag $TAG"

            yq -i "
              (.images[] | select(.name == \"$REPO\").newName) = \"$REPO\" |
              (.images[] | select(.name == \"$REPO\").newTag) = \"$TAG\"
            " "$FILE"
          done

      ############################################################
      # COMMIT BACK TO GITHUB
      ############################################################
      - name: Commit manifest update
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s-manifests/overlays/dev/kustomization.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update image tags for all services"
            git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git
          else
            echo "No changes to commit."
          fi

  ############################################################
  # 3. DONE
  #############################################################
  done:
    needs: update-manifests
    runs-on: self-hosted
    steps:
      - run: echo "CI/CD completed — ArgoCD syncing latest images!"
