name: Build-Scan-CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:

  ############################################################
  # 1. BUILD + SCAN + PUSH (MATRIX)
  ############################################################
  build-scan:
    runs-on: self-hosted

    strategy:
      matrix:
        service:
          - checkoutservice
          - adservice
          - currencyservice
          - paymentservice
          - productcatalogservice
          - frontend-ui
          - frontend-gateway
          - cartservice
          - emailservice
          - shoppingassistantservice
          - shippingservice
          - recommendationservice

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      ############################################################
      # DETERMINE DOCKERFILE PATH
      ############################################################
      - name: Determine Dockerfile Path
        id: pathcheck
        run: |
          SERVICE="${{ matrix.service }}"
          DOCKERFILE="src/$SERVICE/Dockerfile"
          CONTEXT="src/$SERVICE"

          if [ "$SERVICE" = "cartservice" ]; then
            DOCKERFILE="src/cartservice/src/Dockerfile"
            CONTEXT="src/cartservice/src"
          fi

          # frontend-gateway has no Dockerfile
          if [ "$SERVICE" = "frontend-gateway" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -f "$DOCKERFILE" ]; then
            echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "context=$CONTEXT" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      ############################################################
      # DOCKER BUILD
      ############################################################
      - name: Build Docker Image
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          docker build -t ${{ matrix.service }}:latest \
            -f ${{ steps.pathcheck.outputs.dockerfile }} \
            ${{ steps.pathcheck.outputs.context }}

      ############################################################
      # LOGIN TO ECR
      ############################################################
      - name: AWS ECR Login
        if: steps.pathcheck.outputs.found == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region us-east-1 |
          docker login --username AWS \
            --password-stdin 931058976119.dkr.ecr.us-east-1.amazonaws.com

      ############################################################
      # TAG & PUSH TO ECR
      ############################################################
      - name: Push Image to ECR
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          ECR="931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices"
          IMAGE="$ECR/${{ matrix.service }}:$TAG"

          docker tag ${{ matrix.service }}:latest $IMAGE
          docker push $IMAGE

          echo "$IMAGE" > image.txt

      ############################################################
      # UPLOAD IMAGE TAG AS ARTIFACT
      ############################################################
      - name: Upload Image Artifact
        if: steps.pathcheck.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: image.txt


  ############################################################
  # 2. UPDATE KUSTOMIZATION.YAML (ONE JOB ONLY)
  ############################################################
  update-manifests:
    runs-on: self-hosted
    needs: build-scan

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: false

      ############################################################ 
      # UPDATE DEV KUSTOMIZATION.YAML WITH ALL IMAGES
      ############################################################
      - name: Update kustomization.yaml with all images
        run: |
          FILE="k8s-manifests/overlays/dev/kustomization.yaml"
          echo "images:" > $FILE

          # Loop through artifact directories
          for d in /tmp/images/*; do
            if [ -f "$d/image.txt" ]; then
              IMG=$(cat "$d/image.txt")
              NAME=$(echo "$IMG" | awk -F'[:/]' '{print $(NF-1)}')
              TAG=$(echo "$IMG" | awk -F: '{print $2}')
              REPO=$(echo "$IMG" | awk -F: '{print $1}')

              cat <<EOF >> $FILE
            - name: $NAME
              newName: $REPO
              newTag: $TAG

          EOF
                      fi
                    done

      ############################################################
      # COMMIT CHANGES
      ############################################################
      - name: Commit manifest update
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Prevent non-fast-forward errors
          git pull --rebase origin main || true

          git add k8s-manifests/overlays/dev/kustomization.yaml
          git commit -m "Update image tags for all services" || exit 0
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git


  ############################################################
  # 3. DONE (ARGOCD WILL AUTO-DEPLOY)
  ############################################################
  done:
    needs: update-manifests
    runs-on: self-hosted
    steps:
      - run: echo "CI/CD completed — ArgoCD will now sync!"
