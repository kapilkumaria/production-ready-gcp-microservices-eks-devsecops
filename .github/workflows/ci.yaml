name: Build-Scan-CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-scan:
    runs-on: self-hosted

    strategy:
      matrix:
        service:
          - checkoutservice
          - adservice
          - currencyservice
          - paymentservice
          - productcatalogservice
          - frontend-ui
          - frontend-gateway
          - cartservice
          - emailservice
          - shoppingassistantservice
          - shippingservice
          - recommendationservice

    steps:

      ############################################################
      # 1. CHECKOUT
      ############################################################
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ############################################################
      # 2. ADD SONAR SCANNER
      ############################################################
      - name: Add Sonar Scanner to PATH
        run: echo "/opt/devsecops-tools/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Verify Sonar Scanner
        run: sonar-scanner --version

      ############################################################
      # 3. SONAR SCAN
      ############################################################
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd src/${{ matrix.service }}

          sonar-scanner \
            -Dsonar.projectKey=${{ matrix.service }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.sources=. \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.qualitygate.wait=false \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/build/**,**/obj/**,**/bin/**,**/.gradle/**,**/*.md,LICENSE"

      ############################################################
      # 4. DETERMINE DOCKERFILE PATH
      ############################################################
      - name: Determine Dockerfile Path
        id: pathcheck
        run: |
          SERVICE="${{ matrix.service }}"

          DOCKERFILE="src/$SERVICE/Dockerfile"
          CONTEXT="src/$SERVICE"

          if [ "$SERVICE" = "cartservice" ]; then
            DOCKERFILE="src/cartservice/src/Dockerfile"
            CONTEXT="src/cartservice/src"
          fi

          if [ "$SERVICE" = "frontend-gateway" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -f "$DOCKERFILE" ]; then
            echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "context=$CONTEXT" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      ############################################################
      # 5. DOCKER BUILD
      ############################################################
      - name: Build Docker Image
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          SERVICE="${{ matrix.service }}"
          DOCKERFILE="${{ steps.pathcheck.outputs.dockerfile }}"
          CONTEXT="${{ steps.pathcheck.outputs.context }}"
          IMAGE_NAME="${SERVICE}:latest"

          echo "🔥 Building Docker image for $SERVICE"
          docker build -t $IMAGE_NAME -f $DOCKERFILE $CONTEXT

      ############################################################
      # 6. TRIVY SECURITY SCAN (PROFESSIONAL SUMMARY)
      ############################################################
      - name: Trivy Scan (Professional Output)
        if: steps.pathcheck.outputs.found == 'true'
        id: trivy
        run: |
          SERVICE="${{ matrix.service }}"
          IMAGE="${SERVICE}:latest"
          REPORT="trivy-${SERVICE}.txt"

          mkdir -p trivy-reports

          trivy image \
            --format table \
            -o trivy-reports/$REPORT \
            $IMAGE || true

          CRIT=$(grep -c "CRITICAL" trivy-reports/$REPORT || true)
          HIGH=$(grep -c "HIGH" trivy-reports/$REPORT || true)
          MED=$(grep -c "MEDIUM" trivy-reports/$REPORT || true)
          LOW=$(grep -c "LOW" trivy-reports/$REPORT || true)

          echo "## 🛡 Trivy Security Scan — ${SERVICE}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### **Vulnerability Summary**" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔥 CRITICAL | $CRIT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚨 HIGH | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ MEDIUM | $MED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 LOW | $LOW |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **Full Report (Click to Expand)**" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>View Report</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat trivy-reports/$REPORT >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      ############################################################
      # 7. UPLOAD TRIVY REPORT ARTIFACT
      ############################################################
      - name: Upload Trivy Report
        if: steps.pathcheck.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-reports/trivy-${{ matrix.service }}.txt

      ############################################################
      # 8. AWS ECR LOGIN
      ############################################################
      - name: AWS ECR Login
        if: steps.pathcheck.outputs.found == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login \
                --username AWS \
                --password-stdin 931058976119.dkr.ecr.us-east-1.amazonaws.com

      ############################################################
      # 9. TAG & PUSH IMAGE TO AWS ECR
      ############################################################
      - name: Tag & Push Image to ECR
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          SERVICE="${{ matrix.service }}"
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          ECR_REPO="931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices"

          docker tag "${SERVICE}:latest" "$ECR_REPO/${SERVICE}:${SHA_SHORT}"

          echo "🚀 Pushing image: $ECR_REPO/${SERVICE}:${SHA_SHORT}"
          docker push "$ECR_REPO/${SERVICE}:${SHA_SHORT}"

      ############################################################
      # 10. CLEANUP DOCKER IMAGES
      ############################################################
      - name: Cleanup Docker Images
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          SERVICE="${{ matrix.service }}"
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          ECR_REPO="931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices"

          docker rmi "${SERVICE}:latest" || true
          docker rmi "$ECR_REPO/${SERVICE}:${SHA_SHORT}" || true
