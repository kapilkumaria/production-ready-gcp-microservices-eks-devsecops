name: Microservices-CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sonar:
    name: Sonar + Tests + Coverage
    runs-on: self-hosted

    strategy:
      matrix:
        include:
          - { service: checkoutservice, language: go }
          - { service: adservice, language: java }
          - { service: currencyservice, language: node }
          - { service: paymentservice, language: node }
          - { service: productcatalogservice, language: go }
          - { service: frontend-ui, language: node }
          - { service: frontend-gateway, language: node }
          - { service: cartservice, language: csharp }
          - { service: emailservice, language: python }
          - { service: shoppingassistantservice, language: python }
          - { service: shippingservice, language: go }
          - { service: recommendationservice, language: python }

    steps:
      ###########################################################
      # CHECKOUT
      ###########################################################
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ###########################################################
      # SONAR SCANNER
      ###########################################################
      - name: Add sonar-scanner to PATH
        run: echo "/opt/sonar-scanner/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Verify sonar-scanner
        run: |
          which sonar-scanner
          sonar-scanner --version

      ###########################################################
      # FIX GO PATH
      ###########################################################
      - name: Fix Go PATH
        if: matrix.language == 'go'
        run: echo "/usr/local/go/bin" >> $GITHUB_PATH

      ###########################################################
      # PREPARE LANGUAGES
      ###########################################################

      # JAVA
      - name: Verify Java installation
        if: matrix.language == 'java'
        run: java -version

      # NODE — only for services WITH tests
      - name: Install Node dependencies
        if: matrix.language == 'node' &&
            matrix.service != 'currencyservice' &&
            matrix.service != 'paymentservice' &&
            matrix.service != 'frontend-ui' &&
            matrix.service != 'frontend-gateway'
        run: |
          cd src/${{ matrix.service }}
          npm install

      - name: Skip Node dependencies (no tests)
        if: matrix.language == 'node' &&
            (matrix.service == 'currencyservice' ||
             matrix.service == 'paymentservice' ||
             matrix.service == 'frontend-ui' ||
             matrix.service == 'frontend-gateway')
        run: echo "Skipping npm install — this service has NO tests"

      # PYTHON
      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          cd src/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # C#
      - name: Install .NET 9 if missing
        if: matrix.language == 'csharp'
        run: |
          if ! dotnet --version 2>/dev/null; then
            wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
            chmod +x dotnet-install.sh
            sudo ./dotnet-install.sh --channel 9.0 --install-dir /usr/share/dotnet
            sudo ln -sf /usr/share/dotnet/dotnet /usr/bin/dotnet
          fi
          dotnet --version

      ###########################################################
      # TEST + COVERAGE
      ###########################################################

      # JAVA
      - name: Run Java Tests
        if: matrix.language == 'java'
        run: |
          cd src/${{ matrix.service }}
          ./gradlew clean test jacocoTestReport

      # NODE
      - name: Run Node Tests + Coverage
        if: matrix.language == 'node' &&
            matrix.service != 'currencyservice' &&
            matrix.service != 'paymentservice' &&
            matrix.service != 'frontend-ui' &&
            matrix.service != 'frontend-gateway'
        run: |
          cd src/${{ matrix.service }}
          npm test -- --coverage

      - name: Skip Node Tests
        if: matrix.language == 'node' &&
            (matrix.service == 'currencyservice' ||
             matrix.service == 'paymentservice' ||
             matrix.service == 'frontend-ui' ||
             matrix.service == 'frontend-gateway')
        run: echo "Skipping tests — this Node service has NO tests."

      # PYTHON
      - name: Run Python Tests + Coverage
        if: matrix.language == 'python'
        run: |
          cd src/${{ matrix.service }}
          pytest --cov=. --cov-report=xml

      # GO
      - name: Run Go Tests + Coverage
        if: matrix.language == 'go'
        run: |
          cd src/${{ matrix.service }}
          go mod tidy
          go mod vendor
          go test ./... -coverprofile=coverage.out

      # C#
      - name: Run C# Tests + Coverage
        if: matrix.language == 'csharp'
        run: |
          cd src/${{ matrix.service }}

          # No test folder -> create empty coverage file
          if ! ls -R . | grep -i "Test" >/dev/null 2>&1; then
            echo "<CoverageSession></CoverageSession>" > coverage.opencover.xml
            echo "No C# tests detected — generating empty coverage file"
            exit 0
          fi

          dotnet test \
            /p:CollectCoverage=true \
            /p:CoverletOutput=./coverage.opencover.xml \
            /p:CoverletOutputFormat=opencover \
            /p:Exclude=[*]Tests.*

      ###########################################################
      # SONARQUBE ANALYSIS
      ###########################################################
      - name: Run SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd src/${{ matrix.service }}

          EXTRA_ARGS="-Dsonar.qualitygate.wait=true"

          # Global exclusions (SAFE)
          EXTRA_ARGS="$EXTRA_ARGS -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.gradle/**,**/genproto/**,**/build/generated/**"

          # Java binaries
          if [ "${{ matrix.language }}" = "java" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -Dsonar.java.binaries=build/classes/java/main"
          fi

          # Skip JS tests in paymentservice
          if [ "${{ matrix.service }}" = "paymentservice" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -Dsonar.test.exclusions=**/*.js"
          fi

          sonar-scanner \
            -Dsonar.projectKey=${{ matrix.service }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            $EXTRA_ARGS
