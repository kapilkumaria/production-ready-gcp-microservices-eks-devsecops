name: Build-Scan-CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-scan:
    runs-on: self-hosted

    strategy:
      matrix:
        service:
          - checkoutservice
          - adservice
          - currencyservice
          - paymentservice
          - productcatalogservice
          - frontend-ui
          - frontend-gateway
          - cartservice
          - emailservice
          - shoppingassistantservice
          - shippingservice
          - recommendationservice

    steps:
      ###############################################
      # 1. CHECKOUT CODE
      ###############################################
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ###############################################
      # 2. SETUP SONAR SCANNER PATH
      ###############################################
      - name: Add Sonar Scanner to PATH
        run: echo "/opt/devsecops-tools/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Verify Sonar Scanner
        run: sonar-scanner --version

      ###############################################
      # 3. RUN SONAR SCAN
      ###############################################
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd src/${{ matrix.service }}

          sonar-scanner \
            -Dsonar.projectKey=${{ matrix.service }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.sources=. \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.qualitygate.wait=false \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/build/**,**/obj/**,**/bin/**,**/.gradle/**,**/*.md,LICENSE"

      ###############################################
      # 4. DETERMINE DOCKERFILE PATH
      ###############################################
      - name: Determine Dockerfile Path
        id: pathcheck
        run: |
          SERVICE="${{ matrix.service }}"

          # Default path
          DOCKERFILE_PATH="src/${SERVICE}/Dockerfile"

          # Special case for cartservice
          if [ "$SERVICE" = "cartservice" ]; then
            DOCKERFILE_PATH="src/cartservice/src/Dockerfile"
          fi

          # frontend-gateway has NO Dockerfile
          if [ "$SERVICE" = "frontend-gateway" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if Dockerfile actually exists
          if [ -f "$DOCKERFILE_PATH" ]; then
            echo "dockerfile=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Dockerfile missing for $SERVICE — skipping build"
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      ###############################################
      # 5. BUILD DOCKER IMAGE (ONLY IF DOCKERFILE EXISTS)
      ###############################################
      - name: Build Docker Image
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          DOCKERFILE="${{ steps.pathcheck.outputs.dockerfile }}"
          SERVICE="${{ matrix.service }}"
          IMAGE_NAME="${SERVICE}:latest"

          echo "🔥 Building Docker image for $SERVICE using $DOCKERFILE"
          docker build -t $IMAGE_NAME -f $DOCKERFILE .

      ###############################################
      # 6. TRIVY SCAN (ONLY IF DOCKERFILE EXISTS)
      ###############################################
      - name: Run Trivy Image Scan
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          SERVICE="${{ matrix.service }}"
          IMAGE_NAME="${SERVICE}:latest"

          mkdir -p trivy-reports
          trivy image --format table -o trivy-reports/${SERVICE}.txt $IMAGE_NAME || true

      ###############################################
      # 7. UPLOAD TRIVY REPORT
      ###############################################
      - name: Upload Trivy Report
        if: steps.pathcheck.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-reports/${{ matrix.service }}.txt

      ###############################################
      # 8. CLEANUP DOCKER IMAGE
      ###############################################
      - name: Cleanup Local Docker Image
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          SERVICE="${{ matrix.service }}"
          docker rmi ${SERVICE}:latest || true

