name: Build-Scan-CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:

  ############################################################
  # 1. BUILD + PUSH TO ECR (MATRIX JOB)
  ############################################################
  build-scan:
    runs-on: self-hosted

    strategy:
      matrix:
        service:
          - checkoutservice
          - adservice
          - currencyservice
          - paymentservice
          - productcatalogservice
          - frontend-ui
          - frontend-gateway
          - cartservice
          - emailservice
          - shoppingassistantservice
          - shippingservice
          - recommendationservice

    outputs:
      images: ${{ steps.collect.outputs.images }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      ############################################################
      # DETERMINE DOCKERFILE PATH
      ############################################################
      - name: Determine Dockerfile Path
        id: pathcheck
        run: |
          SERVICE="${{ matrix.service }}"
          DOCKERFILE="src/$SERVICE/Dockerfile"
          CONTEXT="src/$SERVICE"

          # Cartservice has nested Dockerfile
          if [ "$SERVICE" = "cartservice" ]; then
            DOCKERFILE="src/cartservice/src/Dockerfile"
            CONTEXT="src/cartservice/src"
          fi

          # Frontend-gateway has NO Dockerfile → skip
          if [ "$SERVICE" = "frontend-gateway" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -f "$DOCKERFILE" ]; then
            echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "context=$CONTEXT" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      ############################################################
      # DOCKER BUILD
      ############################################################
      - name: Build Docker Image
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          docker build -t ${{ matrix.service }}:latest \
            -f ${{ steps.pathcheck.outputs.dockerfile }} \
            ${{ steps.pathcheck.outputs.context }}

      ############################################################
      # LOGIN TO ECR
      ############################################################
      - name: AWS ECR Login
        if: steps.pathcheck.outputs.found == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS \
            --password-stdin 931058976119.dkr.ecr.us-east-1.amazonaws.com

      ############################################################
      # TAG & PUSH TO ECR
      ############################################################
      - name: Push Image to ECR
        id: ecrpush
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          SHA_TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          ECR="931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices"

          docker tag ${{ matrix.service }}:latest $ECR/${{ matrix.service }}:$SHA_TAG
          docker push $ECR/${{ matrix.service }}:$SHA_TAG

          echo "image=$ECR/${{ matrix.service }}:$SHA_TAG" >> $GITHUB_OUTPUT

      ############################################################
      # COLLECT ALL IMAGE TAGS INTO SINGLE OUTPUT
      ############################################################
      - name: Collect image outputs
        id: collect
        run: |
          echo "images<<"EOF"" >> $GITHUB_OUTPUT
          # Only add the image if the push step produced output
          if [ -n "${{ steps.ecrpush.outputs.image }}" ]; then
            echo "${{ steps.ecrpush.outputs.image }}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT


  ############################################################
  # 2. UPDATE DEV KUSTOMIZATION.YAML (ONE JOB ONLY)
  ############################################################
  update-manifests:
    runs-on: self-hosted
    needs: build-scan

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ############################################################
      # UPDATE DEV KUSTOMIZATION.YAML
      ############################################################
      - name: Update kustomization.yaml with all images
        run: |
          FILE="k8s-manifests/overlays/dev/kustomization.yaml"

          echo "images:" > $FILE

          # Loop through all images from matrix
          while read IMG; do
            [ -z "$IMG" ] && continue

            NAME=$(echo "$IMG" | awk -F'[:/]' '{print $(NF-1)}')
            TAG=$(echo "$IMG" | awk -F: '{print $2}')
            REPO=$(echo "$IMG" | awk -F: '{print $1}')

            cat <<EOF >> $FILE
            - name: $NAME
              newName: $REPO
              newTag: $TAG

          EOF

                    done <<< "${{ needs.build-scan.outputs.images }}"

      ############################################################
      # COMMIT CHANGES (WITH PULL --REBASE)
      ############################################################
      - name: Commit manifest update
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Prevent non-fast-forward errors
          git pull --rebase origin main || true

          git add k8s-manifests/overlays/dev/kustomization.yaml
          git commit -m "Update image tags for all services" || exit 0

          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git


  ############################################################
  # 3. DONE (ARGOCD WILL AUTO-SYNC)
  ############################################################
  done:
    needs: update-manifests
    runs-on: self-hosted
    steps:
      - run: echo "CI/CD completed — ArgoCD will now sync!"
