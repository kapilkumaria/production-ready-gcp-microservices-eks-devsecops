name: Build-Scan-CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:

  ############################################################
  # 1. BUILD + PUSH (MATRIX)
  ############################################################
  build-scan:
    runs-on: self-hosted

    strategy:
      matrix:
        service:
          - checkoutservice
          - adservice
          - currencyservice
          - paymentservice
          - productcatalogservice
          - frontend-ui
          - frontend-gateway   # skipped intentionally
          - cartservice
          - emailservice
          - shoppingassistantservice
          - shippingservice
          - recommendationservice

    steps:

      ############################################################
      # Checkout Repo
      ############################################################
      - name: Checkout
        uses: actions/checkout@v4

      ############################################################
      # Determine Dockerfile Path
      ############################################################
      - name: Determine Dockerfile Path
        id: pathcheck
        run: |
          SERVICE="${{ matrix.service }}"
          DOCKERFILE="src/$SERVICE/Dockerfile"
          CONTEXT="src/$SERVICE"

          if [ "$SERVICE" = "cartservice" ]; then
            DOCKERFILE="src/cartservice/src/Dockerfile"
            CONTEXT="src/cartservice/src"
          fi

          if [ "$SERVICE" = "frontend-gateway" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -f "$DOCKERFILE" ]; then
            echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "context=$CONTEXT" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      ############################################################
      # Build Image
      ############################################################
      - name: Build Docker Image
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          docker build -t ${{ matrix.service }}:latest \
            -f ${{ steps.pathcheck.outputs.dockerfile }} \
            ${{ steps.pathcheck.outputs.context }}

      ############################################################
      # Login to AWS ECR
      ############################################################
      - name: AWS ECR Login
        if: steps.pathcheck.outputs.found == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region us-east-1 |
          docker login --username AWS \
            --password-stdin 931058976119.dkr.ecr.us-east-1.amazonaws.com

      ############################################################
      # Tag & Push to ECR
      ############################################################
      - name: Push Image to ECR
        if: steps.pathcheck.outputs.found == 'true'
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          ECR="931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices"

          docker tag ${{ matrix.service }}:latest $ECR/${{ matrix.service }}:$TAG
          docker push $ECR/${{ matrix.service }}:$TAG

          echo "$ECR/${{ matrix.service }}:$TAG" >> images.txt

      ############################################################
      # Upload image list artifact (one per service)
      ############################################################
      - name: Upload image list
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.txt



  ############################################################
  # 2. UPDATE KUSTOMIZATION.YAML (MERGES ALL IMAGES)
  ############################################################
  update-manifests:
    runs-on: self-hosted
    needs: build-scan

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ############################################################
      # Download all image artifacts
      ############################################################
      - name: Download all image files
        uses: actions/download-artifact@v4
        with:
          name: images
          path: /tmp/images

      ############################################################
      # Build final kustomization.yaml (all services)
      ############################################################
      - name: Update kustomization.yaml with all images
        run: |
          FILE="k8s-manifests/overlays/dev/kustomization.yaml"
          echo "images:" > $FILE

          for f in /tmp/images/*; do
            IMG=$(cat "$f")
            NAME=$(echo $IMG | awk -F'[:/]' '{print $(NF-1)}')
            TAG=$(echo $IMG | awk -F: '{print $2}')
            REPO=$(echo $IMG | awk -F: '{print $1}')

          cat <<EOF >> $FILE
            - name: $NAME
              newName: $REPO
              newTag: $TAG
          EOF
                    done

      ############################################################
      # Commit the manifest update
      ############################################################
      - name: Commit manifest update
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add k8s-manifests/overlays/dev/kustomization.yaml
          git commit -m "Update image tags for all services" || exit 0
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git



  ############################################################
  # 3. DONE (ARGOCD AUTO-SYNC)
  ############################################################
  done:
    needs: update-manifests
    runs-on: self-hosted
    steps:
      - run: echo "CI/CD completed — ArgoCD will now sync!"
