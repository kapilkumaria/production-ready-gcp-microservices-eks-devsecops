name: Microservices-CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sonar:
    name: Sonar + Tests + Coverage
    runs-on: self-hosted

    strategy:
      matrix:
        include:
          - { service: checkoutservice, language: go }
          - { service: adservice, language: java }
          - { service: currencyservice, language: node }
          - { service: paymentservice, language: node }
          - { service: productcatalogservice, language: go }
          - { service: frontend-ui, language: node }
          - { service: frontend-gateway, language: node }
          - { service: cartservice, language: csharp }
          - { service: emailservice, language: python }
          - { service: shoppingassistantservice, language: python }
          - { service: shippingservice, language: go }
          - { service: recommendationservice, language: python }

    steps:
      ###########################################################
      # CHECKOUT
      ###########################################################
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ###########################################################
      # SONAR SCANNER
      ###########################################################
      - name: Add sonar-scanner to PATH
        run: echo "/opt/sonar-scanner/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Verify sonar-scanner
        run: |
          which sonar-scanner
          sonar-scanner --version

      ###########################################################
      # GO PATH (SELF-HOSTED)
      ###########################################################
      - name: Fix Go PATH
        if: matrix.language == 'go'
        run: echo "/usr/local/go/bin" >> $GITHUB_PATH

      ###########################################################
      # PREPARE LANGUAGES
      ###########################################################

      # JAVA
      - name: Verify Java installation
        if: matrix.language == 'java'
        run: java -version

      # NODE (only if tests exist)
      - name: Install Node dependencies
        if: matrix.language == 'node' && matrix.service != 'currencyservice' && matrix.service != 'paymentservice' && matrix.service != 'frontend-ui'
        run: |
          cd src/${{ matrix.service }}
          npm install

      - name: Skip Node dependencies (no tests)
        if: matrix.language == 'node' && (matrix.service == 'currencyservice' || matrix.service == 'paymentservice' || matrix.service == 'frontend-ui')
        run: echo "Skipping npm install — no tests for this Node service"

      # PYTHON
      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          cd src/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # C#
      - name: Install .NET 9 SDK if missing
        if: matrix.language == 'csharp'
        run: |
          if ! dotnet --version 2>/dev/null; then
            wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
            chmod +x dotnet-install.sh
            sudo ./dotnet-install.sh --channel 9.0 --install-dir /usr/share/dotnet
            sudo ln -sf /usr/share/dotnet/dotnet /usr/bin/dotnet
          fi

      ###########################################################
      # TEST + COVERAGE
      ###########################################################

      # JAVA
      - name: Run Java Tests + Coverage
        if: matrix.language == 'java'
        run: |
          cd src/${{ matrix.service }}
          ./gradlew clean test jacocoTestReport

      # NODE tests
      - name: Run Node Tests with Coverage
        if: matrix.language == 'node' && matrix.service != 'currencyservice' && matrix.service != 'paymentservice' && matrix.service != 'frontend-ui'
        run: |
          cd src/${{ matrix.service }}
          npm test -- --coverage

      - name: Skip Node Tests (no tests)
        if: matrix.language == 'node' && (matrix.service == 'currencyservice' || matrix.service == 'paymentservice' || matrix.service == 'frontend-ui')
        run: echo "Skipping Node tests (no tests exist)"

      # PYTHON
      - name: Run Python Tests + Coverage
        if: matrix.language == 'python'
        run: |
          cd src/${{ matrix.service }}
          pytest --cov=. --cov-report=xml

      # GO
      - name: Run Go Tests + Coverage
        if: matrix.language == 'go'
        run: |
          cd src/${{ matrix.service }}
          go mod tidy
          go mod vendor
          go test ./... -coverprofile=coverage.out

      # C#
      - name: Run C# Tests + Coverage
        if: matrix.language == 'csharp'
        run: |
          cd src/${{ matrix.service }}
          dotnet test \
            /p:CollectCoverage=true \
            /p:CoverletOutput=./coverage.opencover.xml \
            /p:CoverletOutputFormat=opencover

      ###########################################################
      # SONARQUBE ANALYSIS + QUALITY GATE
      ###########################################################
      - name: Run SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd src/${{ matrix.service }}

          EXTRA_ARGS="-Dsonar.qualitygate.wait=true"

          # Java-specific settings
          if [ "${{ matrix.language }}" = "java" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -Dsonar.java.binaries=build/classes/java/main"
            EXTRA_ARGS="$EXTRA_ARGS -Dsonar.exclusions=build/generated/**,genproto/**"
          fi

          # Skip quality gate for Node services with no tests
          if [ "${{ matrix.service }}" = "currencyservice" ] || \
             [ "${{ matrix.service }}" = "paymentservice" ] || \
             [ "${{ matrix.service }}" = "frontend-ui" ]; then
              EXTRA_ARGS="$EXTRA_ARGS -Dsonar.qualitygate.wait=false -Dsonar.exclusions=**/*"
          fi

          sonar-scanner \
            -Dsonar.projectKey=${{ matrix.service }} \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            $EXTRA_ARGS
