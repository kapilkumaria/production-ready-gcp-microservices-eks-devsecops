loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: 'filesystem'

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: boltdb-shipper
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

# Persistence MUST be at root level — not under "loki:"
persistence:
  enabled: true
  storageClassName: gp3
  accessModes:
    - ReadWriteOnce
  size: 10Gi

# Loki StatefulSet options
singleBinary:
  replicas: 1

# Disable gateway if not using ingress
gateway:
  enabled: false

# Health check & metrics
monitoring:
  selfMonitoring:
    enabled: true
