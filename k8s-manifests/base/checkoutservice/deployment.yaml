apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
  namespace: checkoutservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkoutservice
  template:
    metadata:
      labels:
        app: checkoutservice
    spec:
      serviceAccountName: ecr-access-sa
      containers:
        - name: checkoutservice
          image: checkoutservice:latest
          ports:
            - containerPort: 5050
          env:
            - name: PORT
              value: "5050"

            # REQUIRED SERVICE DEPENDENCIES
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice.productcatalogservice.svc.cluster.local:3550"

            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice.shippingservice.svc.cluster.local:8080"

            - name: CART_SERVICE_ADDR
              value: "cartservice.cartservice.svc.cluster.local:7070"

            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice.currencyservice.svc.cluster.local:7000"

            - name: EMAIL_SERVICE_ADDR
              value: "emailservice.emailservice.svc.cluster.local:8080"

            - name: PAYMENT_SERVICE_ADDR
              value: "paymentservice.paymentservice.svc.cluster.local:50051"
