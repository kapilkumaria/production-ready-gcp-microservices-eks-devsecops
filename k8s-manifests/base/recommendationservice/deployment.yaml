apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  namespace: recommendationservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendationservice
  template:
    metadata:
      labels:
        app: recommendationservice
    spec:
      serviceAccountName: ecr-access-sa
      containers:
        - name: recommendationservice
          image: 931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices/recommendationservice:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
