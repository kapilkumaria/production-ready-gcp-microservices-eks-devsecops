apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: adservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
    spec:
      serviceAccountName: ecr-access-sa
      containers:
        - name: adservice
          image: 931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices/adservice:latest
          imagePullPolicy: Always


          ports:
            - containerPort: 9555
