apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-gateway
  namespace: default
  labels:
    app: frontend-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-gateway
  template:
    metadata:
      labels:
        app: frontend-gateway
    spec:
      serviceAccountName: ecr-access-gateway-sa
      containers:
        - name: frontend-gateway
          # NO TAG HERE — Kustomize will inject the correct tag
          image: 931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices/frontend-gateway
          imagePullPolicy: IfNotPresent   # <- FIXED

          ports:
            - containerPort: 8081

          env:
            - name: PRODUCTCATALOG_SERVICE_ADDR
              value: productcatalogservice.productcatalogservice.svc.cluster.local:3550
            - name: CART_SERVICE_ADDR
              value: cartservice.cartservice.svc.cluster.local:7070
            - name: CURRENCY_SERVICE_ADDR
              value: currencyservice.currencyservice.svc.cluster.local:7000
            - name: CHECKOUT_SERVICE_ADDR
              value: checkoutservice.checkoutservice.svc.cluster.local:5050
            - name: RECOMMENDATION_SERVICE_ADDR
              value: recommendationservice.recommendationservice.svc.cluster.local:8080
            - name: SHIPPING_SERVICE_ADDR
              value: shippingservice.shippingservice.svc.cluster.local:50051
            - name: EMAIL_SERVICE_ADDR
              value: emailservice.emailservice.svc.cluster.local:8080
            - name: AD_SERVICE_ADDR
              value: adservice.adservice.svc.cluster.local:9555
            - name: SHOPPINGASSISTANT_SERVICE_ADDR
              value: shoppingassistantservice.shoppingassistantservice.svc.cluster.local:8080
