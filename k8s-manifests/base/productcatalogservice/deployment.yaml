apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  namespace: productcatalogservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
    spec:
      serviceAccountName: ecr-access-sa
      containers:
        - name: productcatalogservice
          image: 931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices/productcatalogservice:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3550
