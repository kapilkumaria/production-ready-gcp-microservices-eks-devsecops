apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
spec:
  project: default

  source:
    chart: kubernetes-dashboard
    repoURL: https://kubernetes.github.io/dashboard/
    targetRevision: 6.0.8   # chart version, NOT HEAD
    helm:
      releaseName: dashboard
      values: |
        protocolHttp: true

        app:
          image:
            tag: v2.7.0

        service:
          port: 9090

        ingress:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          hosts:
            - dashboard.kapilkumaria.com
          tls:
            - secretName: dashboard-kapilkumaria-com-tls
              hosts:
                - dashboard.kapilkumaria.com

        rbac:
          create: true
        serviceAccount:
          create: true
          name: admin-user
        clusterRoleBinding:
          create: true
          name: admin-user

  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
