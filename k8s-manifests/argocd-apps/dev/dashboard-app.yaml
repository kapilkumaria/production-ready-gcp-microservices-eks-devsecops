apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://kubernetes.github.io/dashboard/
    chart: kubernetes-dashboard
    targetRevision: 6.0.8    # latest stable chart
    helm:
      values: |
        protocolHttp: true
        service:
          externalPort: 443
        ingress:
          enabled: true
          className: nginx
          hosts:
            - dashboard.kapilkumaria.com
          tls:
            - secretName: dashboard-kapilkumaria-com-tls
              hosts:
                - dashboard.kapilkumaria.com

  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
