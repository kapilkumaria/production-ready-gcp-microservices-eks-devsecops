apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://kubernetes.github.io/dashboard/
    chart: kubernetes-dashboard
    targetRevision: 6.0.8    # Helm chart version

    helm:
      releaseName: dashboard
      values: |
        protocolHttp: true

        # Disable Helm-managed ingress completely
        ingress:
          enabled: false

        # Do NOT create service account via Helm
        serviceAccount:
          create: false
          name: admin-user

        # Do NOT let Helm create RBAC or bindings
        rbac:
          create: false
        clusterRoleBinding:
          create: false

        # Dashboard container config
        app:
          image:
            tag: v2.7.0

        service:
          port: 9090

  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
