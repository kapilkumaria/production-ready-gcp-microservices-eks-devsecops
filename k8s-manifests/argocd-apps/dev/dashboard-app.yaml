apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kapilkumaria/production-ready-gcp-microservices-eks-devsecops.git
    targetRevision: HEAD
    path: k8s-manifests/dashboard

    # --- This merges Helm chart + custom RBAC ---
    helm:
      releaseName: dashboard
      chart: kubernetes-dashboard
      repoURL: https://kubernetes.github.io/dashboard/
      version: 6.0.8
      values: |
        protocolHttp: true

        app:
          image:
            tag: v2.7.0
        
        service:
          port: 9090

        containerPort: 9090

        ingress:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          hosts:
            - dashboard.kapilkumaria.com
          tls:
            - secretName: dashboard-kapilkumaria-com-tls
              hosts:
                - dashboard.kapilkumaria.com

  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
