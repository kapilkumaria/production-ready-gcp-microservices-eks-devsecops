apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
spec:
  project: default

  sources:
    # 1️⃣ Helm chart for Kubernetes Dashboard
    - repoURL: https://kubernetes.github.io/dashboard/
      chart: kubernetes-dashboard
      targetRevision: 6.0.8
      helm:
        releaseName: dashboard
        values: |
          protocolHttp: true
          ingress:
            enabled: true
            className: nginx
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
            hosts:
              - dashboard.kapilkumaria.com
            tls:
              - secretName: dashboard-kapilkumaria-com-tls
                hosts:
                  - dashboard.kapilkumaria.com

          rbac:
            create: true
          serviceAccount:
            create: true
            name: admin-user
          clusterRoleBinding:
            create: true
            name: admin-user

    # 2️⃣ LOCAL MANIFESTS (certificate + admin-user + namespace)
    - repoURL: https://github.com/kapilkumaria/production-ready-gcp-microservices-eks-devsecops.git
      targetRevision: HEAD
      path: k8s-manifests/dashboard

  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
