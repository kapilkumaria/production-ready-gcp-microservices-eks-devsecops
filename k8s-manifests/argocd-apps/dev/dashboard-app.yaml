apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://kubernetes.github.io/dashboard/
    chart: kubernetes-dashboard
    targetRevision: 6.0.8
    helm:
      values: |
        protocolHttp: true

        # --- Correct service settings ---
        service:
          type: ClusterIP
          externalPort: 9090      # Service port exposed
          internalPort: 9090      # TargetPort → container

        # --- Pod container port ---
        containerPorts:
          dashboard: 9090

        # --- Ingress config ---
        ingress:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          hosts:
            - dashboard.kapilkumaria.com
          tls:
            - secretName: dashboard-kapilkumaria-com-tls
              hosts:
                - dashboard.kapilkumaria.com

  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
