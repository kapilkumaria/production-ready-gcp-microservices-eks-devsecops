apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'gitops-dashboards'
        orgId: 1
        folder: 'Kubernetes Dashboards'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
