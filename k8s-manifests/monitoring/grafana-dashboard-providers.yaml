apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'custom-dashboards'
        type: file
        folder: 'Custom Dashboards'
        options:
          path: /var/lib/grafana/dashboards/custom
        editable: true
        updateIntervalSeconds: 10
