apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-prometheus-stack-grafana
spec:
  template:
    spec:
      volumes:
        - name: dashboards
          configMap:
            name: grafana-dashboards
      containers:
        - name: grafana
          volumeMounts:
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards/custom
