apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-prometheus-stack-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack
spec:
  template:
    spec:
      volumes:
        - name: dashboards
          $patch: delete
      containers:
        - name: grafana
          volumeMounts:
            - name: dashboards
              $patch: delete
