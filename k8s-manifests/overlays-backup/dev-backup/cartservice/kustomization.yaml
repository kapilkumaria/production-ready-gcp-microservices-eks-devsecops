apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cartservice

resources:
  - ../../../base/cartservice.yaml
  - sa-ecr.yaml

patches:
  - path: ../patch-use-ecr-sa.yaml
    target:
      kind: Deployment

images:
  - name: cartservice
    newName: 931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices/cartservice
    newTag: "<IMAGE_TAG>"
