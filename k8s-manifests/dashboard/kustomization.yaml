apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - delete-old-ingress.yaml

# Delete the old ingress so Helm can create the correct one
patches:
  - target:
      version: v1
      kind: Ingress
      name: kubernetes-dashboard
    patch: |
      $patch: delete
