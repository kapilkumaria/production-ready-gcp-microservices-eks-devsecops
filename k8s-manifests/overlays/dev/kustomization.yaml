apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# --- All microservice namespaces defined here ---
resources:
  - namespaces.yaml

  # Base manifests for all services
  - ../../base/adservice.yaml
  - ../../base/cartservice.yaml
  - ../../base/checkoutservice.yaml
  - ../../base/currencyservice.yaml
  - ../../base/emailservice.yaml
  - ../../base/frontend-ui.yaml
  - ../../base/paymentservice.yaml
  - ../../base/productcatalogservice.yaml
  - ../../base/recommendationservice.yaml
  - ../../base/shippingservice.yaml
  - ../../base/shoppingassistantservice.yaml

  # Shared IRSA service account
  - sa-ecr.yaml

# Patch applied to ALL deployments
patches:
  - path: patch-use-ecr-sa.yaml
    target:
      kind: Deployment

# Images section — GitHub Actions will overwrite this file on each push
images: []
