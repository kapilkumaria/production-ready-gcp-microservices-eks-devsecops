apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: frontend-ui

resources:
  - ../../../base/frontend-ui.yaml
  - ingress.yaml  # already inside this folder

patches:
  - path: ../patch-use-ecr-sa.yaml
    target:
      kind: Deployment

images:
  - name: frontend-ui
    newName: 931058976119.dkr.ecr.us-east-1.amazonaws.com/gcp-microservices/frontend-ui
    newTag: "<IMAGE_TAG>"
